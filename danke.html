<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Danke für deine Anmeldung | Alexandra Vukits - A-Class Marketing
    </title>

    <link
      rel="icon"
      href="sources/Logo_ohne Schriftzug.png"
      type="image/icon"
    />

    <style>
      :root {
        --primary: #68247a;
        --primary-dark: #501b5f;
        --secondary: #fae6c3;

        --ink: #0f172a;
        --sub: #475569;
        --muted: #64748b;

        --border: #e2e8f0;

        --radius: 22px;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px;

        font-family: Arial, sans-serif;

        color: var(--ink);

        background:
          radial-gradient(
            circle at top right,
            rgba(104, 36, 122, 0.12),
            transparent 30%
          ),
          linear-gradient(135deg, #fffdf8 0%, #ffffff 100%);
      }

      .thank-you-card {
        width: 100%;
        max-width: 720px;

        background: white;

        border-radius: 34px;

        padding: 60px 50px;

        text-align: center;

        box-shadow: var(--shadow);

        border: 1px solid var(--border);
      }

      .icon {
        width: 90px;
        height: 90px;

        margin: 0 auto 28px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );

        color: white;

        font-size: 2.6rem;
        font-weight: bold;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.1;

        margin-bottom: 22px;

        color: var(--primary);
      }

      .profile-photo-wrap {
        margin: 0 auto 32px;
        max-width: 460px;
      }

      .profile-photo {
        width: 100%;
        height: auto;

        object-fit: cover;
        object-position: center top;

        border-radius: var(--radius);

        border: 4px solid var(--secondary);

        box-shadow: var(--shadow);

        display: block;
      }

      p {
        font-size: 1.15rem;
        line-height: 1.8;

        color: var(--sub);

        margin-bottom: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        margin-top: 20px;

        padding: 15px 28px;

        border-radius: 999px;

        background: var(--primary);

        color: white;

        font-weight: 700;

        text-decoration: none;

        transition: 0.25s ease;
      }

      .btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        .thank-you-card {
          padding: 40px 28px;
        }

        .profile-photo-wrap {
          max-width: 320px;
          margin-bottom: 24px;
        }

        p {
          font-size: 1rem;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="thank-you-card">
      <div class="icon">✓</div>

      <h1>Vielen Dank für deine Anmeldung!</h1>

      <div class="profile-photo-wrap">
        <img
          class="profile-photo"
          src="images/Foto auf Bank im Profil_klein.jpg"
          alt="Alexandra Vukits"
        />
      </div>

      <p>
        Ich freue mich sehr über deine Anmeldung zu meinem Webinar
        <strong>„Positionierung & Zielgruppenansprache“</strong>
        am 15.09.2026 um 19 Uhr. 😊
      </p>

      <p>Du bekommst zwei Tage vorm Webinar den Teilnahme-Link zugeschickt.</p>

      <p>Bis bald & liebe Grüße<br />Alexandra Vukits</p>

      <a href="index.html" class="btn"> Zurück zur Webseite </a>
    </main>
  </body>
</html>
